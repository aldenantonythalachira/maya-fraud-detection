name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - run: python src/policy.py --self-test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maya
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: maya
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U maya -d maya'
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MAYA_TEST_DATABASE_URL: postgresql://maya:ci-only-password@localhost:5432/maya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_postgres.py -v
      - run: docker compose --env-file .env.example config --quiet
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maya:v4-ci .
