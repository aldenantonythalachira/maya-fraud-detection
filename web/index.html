<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#193b34"><title>MAYA · Wallet</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/refinements.css"><script src="/assets/app.js" type="module"></script></head>
<body><a class="skip-link" href="#app">Skip to wallet</a>
<header class="topbar"><a class="brand" href="/" aria-label="MAYA home"><span class="brand-mark">m</span><span>maya.</span></a><nav class="top-actions" aria-label="Wallet tools"><span class="demo-label">Demo</span><button class="icon-button" id="inspect-toggle" aria-expanded="false" aria-controls="inspector">View decision ↗</button><a class="icon-button" href="/console">Console</a></nav></header>
<div class="workspace" id="workspace"><main id="app" tabindex="-1" aria-busy="true"><div class="loading-card" role="status">Opening wallet…</div></main><aside id="inspector" aria-label="Decision explorer"><div class="inspector-heading"><h2>Decision explorer</h2></div>

<section class="panel"><h3>Access</h3><div class="button-stack"><button class="secondary" id="observer-link">Recipient view ↗</button><button class="secondary" id="revoke-observer">Revoke recipient link</button><button class="secondary" id="delete-world">Delete this wallet</button></div></section></aside></div>
