<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23264F">
  <title>Pay · Maya</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2323264F'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23C9C3EA' font-family='sans-serif'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="user.css">
  <script type="module" src="user.js"></script>
</head>
<body>
  <div class="shell">
    <header class="appbar">
      <h1 class="appname" data-i18n="app_title">Pay</h1>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
      </div>
    </header>

    <!-- What the phone itself knows during this payment (soft signals). -->
    <ul class="phone-status" id="phone-status" aria-label="Phone status" hidden></ul>

    <main id="screen" tabindex="-1">
      <p class="loading" role="status">…</p>
    </main>

    <footer class="appfoot">
      <button type="button" class="text-button" id="open-scenarios" data-i18n="try_scenario">Try a scenario</button>
      <span class="protected"><svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14"><path d="M8 1.5 2.5 3.6v4.1c0 3.2 2.3 5.9 5.5 6.8 3.2-.9 5.5-3.6 5.5-6.8V3.6Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="protected">Protected by Maya</span></span>
    </footer>
  </div>

  <dialog id="scenarios" aria-labelledby="scenarios-title">
    <h2 id="scenarios-title" data-i18n="choose_scenario">Choose a payment to try</h2>
    <ul class="scenario-list" id="scenario-list"></ul>
    <form method="dialog"><button class="text-button" data-i18n="close">Close</button></form>
  </dialog>
</body>
</html>
